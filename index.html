    <!-- Inline Script to prevent FOUC for theme preferences -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
            const metaTheme = document.querySelector('meta[name="color-scheme"]');
            if (metaTheme) metaTheme.content = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            const metaTheme = document.querySelector('meta[name="color-scheme"]');
            if (metaTheme) metaTheme.content = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200 min-h-screen">
